# ──────────────────────────────────────────────────────────
# EMBRACE AI — GitLab CI/CD Pipeline
# code.siemens.com (GitLab)
#
# This pipeline validates the code on every push/MR.
# Deployment to SN1W7220.AD001.SIEMENS.NET is manual
# (run deploy\windows\update-app.ps1 on the server).
#
# To enable automatic deployment, install a GitLab Runner
# on the Windows Server and uncomment the deploy stage.
# ──────────────────────────────────────────────────────────

stages:
  - validate
  - pages
  # - deploy  # Uncomment when a GitLab Runner is installed on the server

# ─── Validate Node.js backend ───
validate-node:
  stage: validate
  image: node:20-alpine
  script:
    - node --check server.js
    - echo "Node.js syntax OK"
  retry: 1
  only:
    - master

# ─── Validate Python backend ───
validate-python:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m py_compile app.py
    - echo "Python syntax OK"
  retry: 1
  only:
    - master

# ─── GitLab Pages — redirect page ───
# Publishes a static redirect page on GitLab Pages. GitLab assigns the
# public URL automatically (shown below as $CI_PAGES_URL) — no custom
# DNS is required. Share that URL; it forwards visitors to the server.
pages:
  stage: pages
  image: alpine:latest
  script:
    - mkdir -p public
    - cp public-pages/index.html public/index.html
    - echo "============================================"
    - echo "Shareable GitLab Pages URL -> $CI_PAGES_URL"
    - echo "============================================"
  artifacts:
    paths:
      - public
  only:
    - master

# ──────────────────────────────────────────────
