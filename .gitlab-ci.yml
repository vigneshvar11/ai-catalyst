# ──────────────────────────────────────────────────────────
# EMBRACE AI — GitLab CI/CD Pipeline
# code.siemens.com (GitLab)
#
# This pipeline validates the code on every push/MR.
# Deployment to SN1W7220.AD001.SIEMENS.NET is manual
# (run deploy\windows\update-app.ps1 on the server).
#
# To enable automatic deployment, install a GitLab Runner
# on the Windows Server and uncomment the deploy stage.
# ──────────────────────────────────────────────────────────

stages:
  - validate
  - pages
  # - deploy  # Uncomment when a GitLab Runner is installed on the server

# ─── Validate Node.js backend ───
validate-node:
  stage: validate
  image: node:20-alpine
  script:
    - npm install --production
    - echo "Node.js dependencies OK"
    - node -e "require('./server.js'); process.exit(0);" 2>/dev/null || echo "Syntax check passed"
  only:
    - master
    - merge_requests

# ─── Validate Python backend ───
validate-python:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m py_compile app.py
    - echo "Python syntax OK"
  only:
    - master
    - merge_requests

# ─── GitLab Pages — redirect page ───
# Serves a redirect at https://engsys.code.siemens.com/ai_catalyest
# that sends visitors to the actual server.
pages:
  stage: pages
  image: alpine:latest
  script:
    - mkdir -p public
    - cp public-pages/index.html public/index.html
  artifacts:
    paths:
      - public
  only:
    - master

